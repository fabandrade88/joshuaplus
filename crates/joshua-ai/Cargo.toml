[package]
name = "joshua-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
joshua-core = { path = "../joshua-core" }
ort = "2.0.0-rc.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3.5.0", default-features = false, features = ["json", "rustls"] }


[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.15", features = ["directml"] }

[features]
# NVIDIA GPUs on Linux/Windows (requires CUDA runtime on the machine).
cuda = ["ort/cuda"]

[lints]
workspace = true
