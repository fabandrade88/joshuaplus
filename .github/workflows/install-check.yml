# Runs the one-line install commands from the README on clean Linux, macOS
# and Windows machines against a published release (latest by default).
# Called by the release workflow after publishing; can also be run by hand.
name: Install check

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to install (empty: the latest release)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  install:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The scripts people run come from main (raw.githubusercontent.com/…/main).
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          JOSHUA_VERSION: ${{ inputs.version }}
        run: sh scripts/install.sh
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JOSHUA_VERSION: ${{ inputs.version }}
        run: ./scripts/install.ps1

  # Arch Linux (what Omarchy is built on): no apt, so the script installs the
  # AppImage and must register it in the application menu (issue #15).
  install-arch:
    name: Install script (Arch Linux, AppImage)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm curl git desktop-file-utils
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: install.sh
        env:
          JOSHUA_VERSION: ${{ inputs.version }}
        run: sh scripts/install.sh
      - name: Menu entry and icons
        run: |
          entry="$HOME/.local/share/applications/joshua-plus.desktop"
          cat "$entry"
          desktop-file-validate "$entry"
          grep -qx "Exec=\"$HOME/.local/bin/joshua-plus\" %U" "$entry"
          grep -qx 'StartupWMClass=joshua-app' "$entry"
          ls -R "$HOME/.local/share/icons/hicolor" | grep joshua-app.png
          test -x "$HOME/.local/bin/joshua-plus"
