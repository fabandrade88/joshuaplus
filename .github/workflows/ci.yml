# Quality gate. Every pull request into main must pass all of these jobs
# before it can be merged (a ruleset on main requires them). Runs once per
# change: on the pull request (not again on the push to test-branch), and
# after the merge on main, which also keeps the build caches warm for the
# next pull requests (caches made on main are shared with every PR).
# A change that only touches documentation skips the build jobs; skipped
# jobs count as passed for the required checks.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # No debug info in CI builds: much faster linking (Windows above all) and
  # smaller caches; test failures still print file and line.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$BEFORE..$AFTER" ;;
            *) range="" ;;
          esac
          # Unknown range (manual run, first push): build everything.
          if [ -z "$range" ] || ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          # Documentation only: Markdown, docs/, issue templates, LICENSE.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^LICENSE$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend (types, tests, build, audit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check (svelte-check, warnings are errors)
        run: pnpm check
      - name: Unit + security static tests (vitest)
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Dependency audit (npm advisories)
        run: pnpm audit --prod

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # The Tauri app embeds the built UI at compile time.
      - name: Build UI
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (unit, property, fuzz, attack, real-time safety)
        run: cargo test --workspace --locked

  performance:
    name: Performance (release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf
      - name: Performance floors (×real time)
        run: cargo test --release --locked -p joshua-core --test performance -- --ignored --nocapture --test-threads=1

  security:
    name: Security (attacks + advisories)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: security
      - name: Attack suites (path traversal, symlinks, hostile media, MIDI floods)
        run: |
          cargo test --locked -p joshua-core --test security_attacks --test review_attacks --test fuzz_media --test properties
          cargo test --locked -p joshua-midi --test hostile_input
          cargo test --locked -p joshua-engine --test realtime_safety
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec advisory audit (vulnerabilities fail the build)
        run: cargo audit
