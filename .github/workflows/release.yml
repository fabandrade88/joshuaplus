# Builds installers for every platform when a version tag (v*) is pushed,
# attaches them to a GitHub (pre-)release and publishes SHA256SUMS, which the
# install scripts verify before installing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the release for this tag (draft or not) when re-running.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            prerelease=false
            case "$TAG" in *-*) prerelease=true ;; esac
            # Take the id from the create response: a fresh draft can take a
            # moment to show up in the releases listing.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Joshua+ ${TAG#v}" \
              -F draft=true -F prerelease=$prerelease \
              -F body=@.github/RELEASE_NOTES.md --jq .id)
          fi
          [ -n "$id" ] || { echo "::error::no release id for $TAG"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.create.outputs.id }}
          args: --target ${{ matrix.target }}

  # Every installer is installed and started on a clean machine before the
  # release goes public. The app must stay up for 20 s (no device, no
  # workspace: it shows its welcome screen and keeps running).
  verify:
    name: Install and start (${{ matrix.name }})
    needs: [create, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux .deb
            os: ubuntu-24.04
            kind: deb
          - name: Linux AppImage
            os: ubuntu-24.04
            kind: appimage
          - name: Linux .rpm (contents)
            os: ubuntu-24.04
            kind: rpm
          - name: Windows setup.exe
            os: windows-latest
            kind: nsis
          - name: Windows .msi
            os: windows-latest
            kind: msi
          - name: macOS .dmg
            os: macos-latest
            kind: dmg
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Linux runtime (WebKitGTK, ALSA, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libasound2t64 rpm2cpio cpio libfuse2t64
      - name: Download
        shell: bash
        run: |
          case "${{ matrix.kind }}" in
            deb) pat='*.deb' ;; appimage) pat='*.AppImage' ;; rpm) pat='*.rpm' ;;
            nsis) pat='*-setup.exe' ;; msi) pat='*.msi' ;; dmg) pat='*.dmg' ;;
          esac
          mkdir pkg
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pat" --dir pkg
          ls -la pkg
      - name: Install and start (.deb)
        if: matrix.kind == 'deb'
        run: |
          deb=$(ls pkg/*.deb)
          sudo apt-get install -y "./$deb"
          name=$(dpkg-deb -f "$deb" Package)
          bin=$(dpkg -L "$name" | grep '^/usr/bin/' | head -n1)
          echo "installed $name -> $bin"
          set +e; timeout 20 xvfb-run -a "$bin"; code=$?; set -e
          echo "exit code $code"; [ "$code" -eq 124 ]
      - name: Start (AppImage)
        if: matrix.kind == 'appimage'
        run: |
          app=$(ls pkg/*.AppImage); chmod +x "$app"
          set +e; timeout 20 xvfb-run -a "$app"; code=$?; set -e
          echo "exit code $code"; [ "$code" -eq 124 ]
      - name: Unpack and start (.rpm)
        if: matrix.kind == 'rpm'
        run: |
          mkdir root && cd root
          rpm2cpio ../pkg/*.rpm | cpio -idm --quiet
          bin=$(ls usr/bin/* | head -n1); echo "binary $bin"
          set +e; timeout 20 xvfb-run -a "./$bin"; code=$?; set -e
          echo "exit code $code"; [ "$code" -eq 124 ]
      - name: Install and start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem pkg | Select-Object -First 1
          if ("${{ matrix.kind }}" -eq "nsis") {
            Start-Process -Wait -FilePath $pkg.FullName -ArgumentList '/S'
          } else {
            Start-Process -Wait -FilePath msiexec -ArgumentList '/i', "`"$($pkg.FullName)`"", '/qn', '/norestart'
          }
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match 'Joshua' -and $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "installed executable not found" }
          Write-Host "installed: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "app ran for 20 s"
      - name: Install and start (macOS)
        if: runner.os == 'macOS'
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" pkg/*.dmg
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -n1)
          # Create the folder first: copying onto a missing "Applications/"
          # would create it as a copy of the app itself.
          mkdir -p "$HOME/Applications"
          cp -R "$app" "$HOME/Applications/"
          hdiutil detach "$mnt"
          installed="$HOME/Applications/$(basename "$app")"
          exe=$(defaults read "$installed/Contents/Info" CFBundleExecutable)
          echo "installed $installed ($exe), arch: $(lipo -archs "$installed/Contents/MacOS/$exe")"
          "$installed/Contents/MacOS/$exe" & pid=$!
          sleep 20
          kill -0 "$pid" || { echo "app exited early"; exit 1; }
          kill "$pid"; echo "app ran for 20 s"

  publish:
    name: Checksums and publish
    needs: [create, build, verify]
    if: ${{ !cancelled() && needs.create.result == 'success' && needs.build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # The one-line install commands from the README, against the published
  # release (checksum check included).
  install-scripts:
    needs: publish
    uses: ./.github/workflows/install-check.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
