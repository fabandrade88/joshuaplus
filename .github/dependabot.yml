version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    target-branch: test-branch
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    target-branch: test-branch
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: test-branch
